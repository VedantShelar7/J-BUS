<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity - Admin Alerts</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <style>
        .alert-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            border-left: 6px solid var(--danger);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease-out;
        }
        .alert-card.resolved {
            border-left-color: var(--tertiary);
            opacity: 0.7;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pulse {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<div id="app">
    <div id="page-admin-alerts" class="page dashboard-layout active">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="brand">
                <div class="brand-icon">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
                </div>
                <div class="brand-text">Velocity</div>
            </div>
            <div class="user-card">
                <div class="user-card-avatar" id="admin-avatar-main"></div>
                <div class="user-card-info">
                    <h4 id="admin-name-main">Admin User</h4>
                    <p>System Administrator</p>
                </div>
            </div>
            <div class="nav-menu">
                <div class="nav-item" onclick="switchNav(this, 'admin-dashboard.html')">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg> Dashboard
                </div>
                <div class="nav-item active" onclick="switchNav(this, 'admin-alerts.html')">
                    <svg class="icon" viewBox="0 0 24 24" style="color: var(--danger);"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg> Emergency Alerts
                </div>
                <div class="nav-item" onclick="switchNav(this, 'admin-live-tracking.html')">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/></svg> Live Tracking
                </div>
                <div class="nav-item" onclick="switchNav(this, 'admin-profile.html')">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg> Profile
                </div>
                <div class="nav-item" onclick="signOut()" style="margin-top: auto; color: var(--danger);">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg> Logout
                </div>
            </div>
        </div>

        <div class="main-content" style="background: var(--neutral); overflow-y: auto;">
            <div class="topbar">
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div class="brand-icon" style="cursor: pointer; width: 36px; height: 36px;" onclick="toggleSidebar()">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                    </div>
                    <h1 style="color: var(--danger); font-size: 24px;">Incident Reports & Alerts</h1>
                </div>
            </div>

            <div style="padding: 32px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                    <div>
                        <h2>Active Emergencies</h2>
                        <p style="color: var(--text-muted);">Real-time alerts from drivers in the field.</p>
                    </div>
                    <button class="btn btn-outlined" onclick="loadAlerts()">Refresh Dashboard</button>
                </div>

                <div id="alerts-container">
                    <!-- Alerts will be loaded here -->
                    <div style="padding: 80px; text-align: center; color: var(--text-muted); background: white; border-radius: 16px;">
                        <svg class="icon" viewBox="0 0 24 24" style="width: 64px; height: 64px; opacity: 0.1; margin-bottom: 16px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.47 10 10 10 10-4.47 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        <p>No active emergency alerts at this time.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="js/mockData.js"></script>
<script src="js/main.js"></script>
<script>
    async function loadAlerts() {
        const container = document.getElementById('alerts-container');
        const res = await MockAPI.getAlerts();
        
        if (res.success && res.data.length > 0) {
            container.innerHTML = '';
            res.data.forEach(alert => {
                const card = document.createElement('div');
                card.className = "alert-card " + (alert.status === 'resolved' ? 'resolved' : 'pulse');
                
                const date = new Date(alert.timestamp).toLocaleString();
                
                card.innerHTML = `
                    <div style="display: flex; gap: 20px; align-items: center;">
                        <div style="width: 50px; height: 50px; border-radius: 12px; background: ${alert.status === 'active' ? '#FEE2E2' : '#F3F4F6'}; color: ${alert.status === 'active' ? '#EF4444' : '#9CA3AF'}; display: flex; align-items: center; justify-content: center;">
                            <svg class="icon" style="width: 30px; height: 30px;" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
                        </div>
                        <div>
                            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 4px;">
                                <span style="font-weight: 700; font-size: 18px; color: var(--text);">Bus ${alert.busId}</span>
                                <span class="pill pill-${alert.status === 'active' ? 'danger' : 'neutral'}">${alert.status.toUpperCase()}</span>
                            </div>
                            <div style="font-size: 14px; color: var(--text-muted);">
                                <strong>Driver:</strong> ${alert.driverName} | <strong>Contact:</strong> ${alert.contactDetails}
                            </div>
                            <div style="font-size: 14px; margin-top: 8px; color: var(--text);">
                                "${alert.message}"
                            </div>
                            <div style="font-size: 12px; color: var(--text-muted); margin-top: 12px;">
                                Received at ${date}
                            </div>
                        </div>
                    </div>
                    <div style="display: flex; gap: 12px;">
                        ${alert.status === 'active' ? '<button class="btn btn-primary" onclick="resolveAlert(\'' + alert.id + '\')" style="background: var(--tertiary);">Mark Resolved</button>' : ''}
                        <button class="btn btn-outlined" onclick="window.location.href=\'admin-live-tracking.html\'">Locate Bus</button>
                    </div>
                `;
                container.appendChild(card);
            });
        } else {
            container.innerHTML = '<div style="padding: 80px; text-align: center; color: var(--text-muted); background: white; border-radius: 16px;"><p>No emergency alerts found.</p></div>';
        }
    }

    async function resolveAlert(id) {
        const res = await fetch("/api/alerts/" + id + "/resolve", { method: 'PATCH' });
        if (res.ok) {
            loadAlerts();
        }
    }

    // Auto-refresh alerts
    setInterval(loadAlerts, 5000);
    loadAlerts();

    // Init admin info
    if (state.user) {
        document.getElementById('admin-name-main').innerText = state.user.name;
        document.getElementById('admin-avatar-main').innerHTML = '<img src="https://ui-avatars.com/api/?name=' + encodeURIComponent(state.user.name) + '&background=0F172A&color=fff" style="width:100%;height:100%;border-radius:50%">';
    }
</script>
</body>
</html>
