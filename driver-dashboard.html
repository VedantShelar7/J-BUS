<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity - Driver Dashboard</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Leaflet JS & CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <link rel="stylesheet" href="css/main.css">
    <style>
        #driver-map { height: 100% !important; width: 100% !important; background: #f8fafc !important; }
        .dashboard-layout { height: 100vh !important; overflow: hidden !important; display: flex; }
        .main-content { flex: 1 !important; height: 100vh !important; display: flex !important; flex-direction: column !important; overflow: hidden !important; position: relative; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
    </style>
    <script>
        window.signOut = function() {
            sessionStorage.removeItem('velocity_user');
            window.location.href = 'index.html';
        };
    </script>
</head>

<body>
    <div id="app">
        <div id="page-driver" class="page dashboard-layout active">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="brand">
                    <div class="brand-icon">
                        <svg class="icon" viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
                    </div>
                    <div class="brand-text">Velocity</div>
                </div>
                <div class="user-card">
                    <div class="user-card-avatar" style="background: var(--tertiary);"><img id="sidebar-avatar" src="" style="width:100%;height:100%;border-radius:50%"></div>
                    <div class="user-card-info"><h4 id="sidebar-user-name">Driver</h4><p id="sidebar-bus-info">Bus Loading...</p></div>
                </div>
                <div class="nav-menu">
                    <div class="nav-item active"><svg class="icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg> Console</div>
                    <div class="nav-item" onclick="signOut()" style="margin-top:auto; color:var(--danger)"><svg class="icon" viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg> Logout</div>
                </div>
            </div>

            <!-- Main Content -->
            <div class="main-content">
                <div id="driver-map" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1;"></div>
                
                <!-- Topbar Overlay -->
                <div class="topbar glass-panel" style="position: absolute; top: 20px; left: 20px; right: 20px; z-index: 100; border-radius: 20px; padding: 0 24px; height: 64px; width: calc(100% - 40px);">
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <div class="brand-icon" style="cursor: pointer; width: 36px; height: 36px; background: var(--tertiary);" onclick="toggleSidebar()">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                        </div>
                        <h3 style="font-weight: 800; font-size: 18px; margin: 0;">DRIVER CONSOLE</h3>
                    </div>
                    <div class="topbar-right">
                        <div class="pill pill-tertiary" style="height: 32px; display: flex; align-items: center; gap: 8px;">
                            <div style="width: 8px; height: 8px; background: var(--tertiary); border-radius: 50%;" class="pulse"></div>
                            LIVE BROADCASTING
                        </div>
                        <div class="avatar" style="width: 40px; height: 40px; border: 2px solid var(--tertiary);" onclick="toggleDropdown('driver-dropdown')">
                            <img id="topbar-avatar" src="" style="width:100%;height:100%;border-radius:50%">
                        </div>
                    </div>
                </div>

                <!-- Control Panel -->
                <div class="glass-panel" style="position: absolute; top: 104px; left: 20px; width: 340px; bottom: 20px; z-index: 100; border-radius: 24px; display: flex; flex-direction: column; padding: 24px; gap: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <h2 style="font-size: 20px; font-weight: 800; margin: 0;">Drive Ops</h2>
                        <span class="pill pill-tertiary" style="font-size: 10px;">DUTY ON</span>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <button id="start-trip-btn" class="btn btn-primary" style="height: 70px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;" onclick="startDriverTrip()">
                            <svg class="icon" viewBox="0 0 24 24" style="width: 20px;"><path d="M8 5v14l11-7z"/></svg>
                            <span style="font-size: 11px; font-weight: 800;">START</span>
                        </button>
                        <button id="end-trip-btn" class="btn btn-secondary" style="height: 70px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; opacity: 0.5;" disabled>
                            <svg class="icon" viewBox="0 0 24 24" style="width: 20px;"><path d="M6 6h12v12H6z"/></svg>
                            <span style="font-size: 11px; font-weight: 800;">END</span>
                        </button>
                    </div>

                    <div class="card" style="padding: 16px; background: rgba(0,0,0,0.03); border: none; border-radius: 16px;">
                        <div style="font-size: 11px; font-weight: 800; color: var(--text-muted); margin-bottom: 4px;">ACTIVE ROUTE</div>
                        <h3 id="driver-route-name" style="font-size: 18px; margin: 0;">Route 14A • Express</h3>
                    </div>

                    <div style="flex: 1; overflow-y: auto;">
                        <div class="label" style="font-weight: 800; color: var(--primary); margin-bottom: 12px;">STOPS REMAINING</div>
                        <div id="driver-stops-list" style="display: flex; flex-direction: column; gap: 16px; padding-left: 10px; position: relative;">
                            <div style="position: absolute; left: 4px; top: 5px; bottom: 5px; width: 2px; background: var(--border);"></div>
                            <div style="display: flex; align-items: center; gap: 12px;"><div style="width:10px;height:10px;border-radius:50%;background:var(--primary);z-index:1"></div><div style="font-size: 14px; font-weight: 700;">Main Gate</div></div>
                            <div style="display: flex; align-items: center; gap: 12px; opacity: 0.5;"><div style="width:10px;height:10px;border-radius:50%;background:var(--white);border:2px solid var(--border);z-index:1"></div><div style="font-size: 14px; font-weight: 600;">Student Res West</div></div>
                        </div>
                    </div>

                    <button class="btn btn-action-danger btn-full" style="height: 54px; border-radius: 16px; font-weight: 800;" onclick="showEmergencyAlert()">
                        🚨 EMERGENCY ALERT
                    </button>
                </div>

                <!-- Status Overlay -->
                <div class="glass-panel" style="position: absolute; bottom: 20px; left: 380px; right: 20px; padding: 20px; border-radius: 24px; z-index: 100; display: flex; justify-content: space-around; align-items: center;">
                    <div style="text-align: center;">
                        <div style="font-size: 10px; font-weight: 800; color: var(--text-muted);">NEXT STOP</div>
                        <h2 id="next-stop-time" style="font-size: 24px; font-weight: 800; margin: 0; color: var(--primary);">12 Mins</h2>
                    </div>
                    <div style="width: 1px; height: 40px; background: rgba(0,0,0,0.05);"></div>
                    <div style="text-align: center;">
                        <div style="font-size: 10px; font-weight: 800; color: var(--text-muted);">SPEED</div>
                        <h2 id="driver-avg-speed" style="font-size: 24px; font-weight: 800; margin: 0;">24 km/h</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/mockData.js?v=2"></script>
    <script src="js/main.js?v=2"></script>
    <script>
        (function () {
            const map = L.map('driver-map', { zoomControl: false }).setView([15.8497, 74.4977], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(map);

            let driverMarker = null;

            function updateLocation() {
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        const latlng = [pos.coords.latitude, pos.coords.longitude];
                        if (!driverMarker) {
                            driverMarker = L.marker(latlng, { icon: L.divIcon({ className:'custom-bus-marker', html:'<div style="width:20px;height:20px;background:#10B981;border:3px solid white;border-radius:50%"></div>' }) }).addTo(map);
                            map.setView(latlng);
                        } else {
                            driverMarker.setLatLng(latlng);
                        }
                    });
                }
            }
            setInterval(updateLocation, 5000);
            updateLocation();

            // Sync user
            const user = JSON.parse(sessionStorage.getItem('velocity_user') || '{}');
            if (user.name) {
                document.getElementById('sidebar-user-name').innerText = user.name;
                const avatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=10B981&color=fff`;
                document.getElementById('sidebar-avatar').src = avatar;
                document.getElementById('topbar-avatar').src = avatar;
                document.getElementById('sidebar-bus-info').innerText = 'Vehicle: ' + (user.busId || 'V-102');
            }
        })();
    </script>
</body>
</html>
