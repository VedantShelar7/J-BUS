<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity - Admin Live Tracking</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700&display=swap" rel="stylesheet">
    <!-- Leaflet JS & CSS from Cloudflare (Alternative to Unpkg) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <style>
        .active-fleet-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .layers-overlay { position: absolute; bottom: 24px; right: 24px; width: 220px; background: var(--white); border-radius: var(--radius-xl); padding: 24px; box-shadow: var(--shadow-premium); border: 1px solid var(--border-refined); z-index: 1000; }
        .bus-card-detailed {
            padding: 16px;
            background: var(--white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-refined);
            cursor: pointer;
            transition: 0.2s;
        }
        .bus-card-detailed:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .layer-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border-refined); }
        .layer-item:last-child { margin-bottom: 0; }
        .layer-dot { width: 8px; height: 8px; border-radius: 50%; }
    </style>
</head>
<body class="theme-admin">

<div id="app">
    <div class="dashboard-layout">

        <div class="sidebar">
            <div class="brand">
                <div class="brand-icon" style="background: var(--admin-primary);">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
                </div>

            </div>
            
            <div class="user-card">

            </div>
            
            <div class="nav-menu">

                    <svg class="icon" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg> Settings
                </div>
                <div class="nav-item" onclick="signOut()" style="margin-top: auto; color: var(--danger);">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                    </svg> Logout

            <div class="sidebar-bottom">

            <div class="dash-cols">

                    </div>

                    <div id="admin-live-map" style="width: 100%; height: 100%;"></div>

                    <!-- Layers Overlay -->
                    <div class="layers-overlay">
                        <div class="card" style="padding: 12px 16px; border-radius: var(--radius-pill); display: flex; align-items: center; gap: 12px; margin-bottom: 24px; border-color: var(--border-refined); box-shadow: var(--shadow-premium);">
                            Active Layers <svg class="icon" style="width:14px; height:14px;" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
                        </div>
                        <div id="dynamic-layers">

<!-- JS -->
<script src="js/mockData.js"></script>
<script src="js/main.js"></script>
<script>
    // Initialize Map with guardrails
    let map;
    function initLiveMap() {
        if (typeof L === 'undefined') {
            console.error("Leaflet not loaded");
            return;
        }
        map = L.map('admin-live-map', { zoomControl: false }).setView([15.8497, 74.4977], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        setTimeout(() => map.invalidateSize(), 800);
        window.addEventListener('resize', () => map.invalidateSize());

        // Override toggleSidebar to fix map
        const originalToggle = window.toggleSidebar;
        window.toggleSidebar = function() {
            if (typeof originalToggle === 'function') originalToggle();
            setTimeout(() => map.invalidateSize(), 400);
        };
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initLiveMap);
    } else {
        initLiveMap();
    }

    const fleetListEl = document.getElementById('fleet-list');
    const topViewBusSVG = `<svg viewBox="-7 -17 14 34" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <rect x="-7" y="-17" width="14" height="34" rx="3" fill="#F5A623"/>
  <rect x="-7" y="-17" width="14" height="6" rx="3" fill="#E8960A"/>
  <rect x="-7" y="11" width="14" height="6" rx="3" fill="#D4820A"/>
  <rect x="-6" y="-11" width="12" height="7" rx="2" fill="#C8EDFF" stroke="#0077AA" stroke-width="0.8"/>
  <rect x="-5" y="-10" width="4" height="5" rx="1" fill="#A8DFFF"/>
  <rect x="1" y="-10" width="4" height="5" rx="1" fill="#A8DFFF"/>
  <rect x="-6" y="-2" width="12" height="6" rx="1" fill="#C8EDFF" stroke="#0077AA" stroke-width="0.8"/>
  <rect x="-5" y="-1" width="3" height="4" rx="1" fill="#A8DFFF"/>
  <rect x="-1" y="-1" width="3" height="4" rx="1" fill="#A8DFFF"/>
  <rect x="3" y="-1" width="3" height="4" rx="1" fill="#A8DFFF"/>
  <rect x="-6" y="6" width="12" height="6" rx="1" fill="#C8EDFF" stroke="#0077AA" stroke-width="0.8"/>
  <rect x="-5" y="7" width="3" height="4" rx="1" fill="#A8DFFF"/>
  <rect x="-1" y="7" width="3" height="4" rx="1" fill="#A8DFFF"/>
  <rect x="3" y="7" width="3" height="4" rx="1" fill="#A8DFFF"/>
  <rect x="-10" y="-14" width="3" height="6" rx="2" fill="#E8960A" stroke="#C87A00" stroke-width="0.5"/>
  <rect x="7" y="-14" width="3" height="6" rx="2" fill="#E8960A" stroke="#C87A00" stroke-width="0.5"/>
  <rect x="-10" y="8" width="3" height="6" rx="2" fill="#E8960A" stroke="#C87A00" stroke-width="0.5"/>
  <rect x="7" y="8" width="3" height="6" rx="2" fill="#E8960A" stroke="#C87A00" stroke-width="0.5"/>
  <rect x="-7" y="-17" width="14" height="34" rx="3" fill="none" stroke="#C87A00" stroke-width="1"/>
  <rect x="-5" y="-17" width="4" height="2" rx="1" fill="#FFFDE0"/>
  <rect x="1" y="-17" width="4" height="2" rx="1" fill="#FFFDE0"/>
  <rect x="-5" y="15" width="4" height="2" rx="1" fill="#FF5555"/>
  <rect x="1" y="15" width="4" height="2" rx="1" fill="#FF5555"/>
  <rect x="-12" y="-12" width="2" height="5" rx="1" fill="#E8960A"/>
  <rect x="10" y="-12" width="2" height="5" rx="1" fill="#E8960A"/>
</svg>`;

    const busIcon = (zoom, color = '#F5A623') => L.divIcon({
        className: '',
        html: `<div style="width:36px;height:60px;transform-origin:center center; transition: transform 0.5s ease;">${topViewBusSVG.replace('#F5A623', color)}</div>`,
        iconSize: [36, 60],
        iconAnchor: [18, 30]
    });

    function getDist(lat1, lon1, lat2, lon2) {
        var R = 6371e3;
        var f1 = lat1 * Math.PI/180;
        var f2 = lat2 * Math.PI/180;
        var df = (lat2-lat1) * Math.PI/180;
        var dl = (lon2-lon1) * Math.PI/180;
        var a = Math.sin(df/2) * Math.sin(df/2) + Math.cos(f1) * Math.cos(f2) * Math.sin(dl/2) * Math.sin(dl/2);
        var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }

    const searchInput = document.querySelector('.form-input');
    function loadLiveFleet() {
        MockAPI.getBuses().then(res => {
            const buses = res.data;
            renderFleetList(buses);
            renderLiveMap(buses);
            document.getElementById('active-units-count').innerText = buses.filter(b => b.status === 'active').length + ' Active Units';
        });
    }

    async function renderFleetList(buses) {
        const routesRes = await MockAPI.getRoutes();
        const routesMap = {};
        if (routesRes.success) {
            routesRes.data.forEach(r => routesMap[r.id] = r.routeName);
        }

        fleetListEl.innerHTML = '';
        buses.forEach(bus => {
            if (bus.status === 'active') {
                const occPerc = Math.round((bus.currentOccupancy / bus.capacity) * 100);
                const occColor = occPerc > 80 ? 'bg-danger' : (occPerc > 50 ? 'bg-warning' : 'bg-success');
                const routeName = routesMap[bus.assignedRoute] || bus.assignedRoute.replace(/-/g, ' ');
                const isLiveBadge = bus.isLive
                    ? `<span class="pill pill-tertiary" style="font-size:9px; padding: 2px 8px;">● LIVE</span>`
                    : `<span class="pill" style="font-size:9px; padding: 2px 8px; background:var(--neutral); color:var(--text-muted);">IDLE</span>`;

                const card = document.createElement('div');
                card.className = 'bus-card-detailed';
                card.innerHTML = `
                    <div style="display:flex; justify-content: space-between; margin-bottom: 12px; align-items:center;">
                        <div style="display:flex; align-items:center; gap:12px;">
                            <div style="width:40px;height:40px;background:var(--neutral);border-radius:10px;display:flex;align-items:center;justify-content:center;">
                                <svg class="icon" style="color:var(--admin-primary);" viewBox="0 0 24 24"><path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/></svg>
                            </div>
                            <div>
                                <div style="font-weight: 600;">${bus.busId}</div>
                                <div style="font-size:10px; color:var(--text-muted); text-transform:uppercase;">${routeName}</div>
                            </div>
                        </div>
                        ${isLiveBadge}
                    </div>
                    <div style="display:flex; justify-content: space-between; font-size:10px; font-weight:600; margin-bottom: 8px;">
                        <div style="color: var(--text-muted);">DRIVER <span style="color:var(--text-primary); margin-left:8px;">${bus.assignedDriver}</span></div>
                        <div style="color: var(--text-muted);">SPEED <span style="color:var(--text-primary); margin-left:8px;">${bus.lastLocation ? bus.lastLocation.speed : 0} km/h</span></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:10px; color:var(--text-muted); font-weight:600; margin-bottom: 6px;">
                        <span>OCCUPANCY</span><span style="color:var(--text-primary);">${bus.currentOccupancy}/${bus.capacity} (${occPerc}%)</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill ${occColor}" style="width: ${occPerc}%;"></div>
                    </div>
                `;
                fleetListEl.appendChild(card);
            }
        });
    }

    const busMarkers = {};
    const routePolylines = {};
    const prevLocs = {};
    const currentAssignedRouteId = {};

    const activeLayers = {}; // routeId -> boolean

    function loadDynamicLayers() {
        MockAPI.getRoutes().then(res => {
            if (!res.success) return;
            const wrapper = document.getElementById('dynamic-layers');
            if (wrapper) wrapper.innerHTML = '';
            
            res.data.forEach(r => {
                if(r.isActive) {
                    activeLayers[r.id] = true; // default all on
                    const div = document.createElement('div');
                    div.className = 'layer-item';
                    div.style.cursor = 'pointer';
                    div.style.marginTop = '12px';
                    div.innerHTML = `
                        <div style="display:flex; align-items:center; gap:8px;">
                            <div class="layer-dot" style="background: ${r.color || 'var(--primary)'}; width:12px; height:12px; border-radius:50%;"></div>
                            <span style="font-weight: 500;">${r.routeName}</span>
                        </div>
                        <div class="toggle-switch active" style="transform: scale(0.8);">
                            <div class="toggle-dot" style="left: 22px;"></div>
                        </div>
                    `;
                    div.onclick = () => {
                        activeLayers[r.id] = !activeLayers[r.id];
                        const tgl = div.querySelector('.toggle-switch');
                        const dot = div.querySelector('.toggle-dot');
                        if (activeLayers[r.id]) {
                            tgl.classList.add('active');
                            dot.style.left = '22px';
                        } else {
                            tgl.classList.remove('active');
                            dot.style.left = '2px';
                        }
                        
                        // Toggle polylines and markers
                        Object.keys(currentAssignedRouteId).forEach(busId => {
                            if (currentAssignedRouteId[busId] === r.id) {
                                if (activeLayers[r.id]) {
                                    if(routePolylines[busId] && !map.hasLayer(routePolylines[busId])) map.addLayer(routePolylines[busId]);
                                    if(busMarkers[busId] && !map.hasLayer(busMarkers[busId])) map.addLayer(busMarkers[busId]);
                                } else {
                                    if(routePolylines[busId] && map.hasLayer(routePolylines[busId])) map.removeLayer(routePolylines[busId]);
                                    if(busMarkers[busId] && map.hasLayer(busMarkers[busId])) map.removeLayer(busMarkers[busId]);
                                }
                            }
                        });
                    };
                    if(wrapper) wrapper.appendChild(div);
                }
            });
        });
    }

    function updateTrafficOverview(buses) {
        const activeBuses = buses.filter(b => b.status === 'active' && b.isLive);
        let totalSpeed = 0;
        let onTimeCount = 0;
        
        if (activeBuses.length === 0) {
            const speedEl = document.getElementById('avg-speed');
            const onTimeEl = document.getElementById('on-time-perc');
            if (speedEl) speedEl.innerText = '--';
            if (onTimeEl) onTimeEl.innerText = '--%';
            return;
        }

        activeBuses.forEach(b => {
             const spd = b.lastLocation ? b.lastLocation.speed : 0;
             totalSpeed += Number(spd);
             if(Number(spd) >= 10 || true) onTimeCount++; // Fake logic for on-time based on speed/liveliness
        });

        const avgSpd = (totalSpeed / activeBuses.length).toFixed(1);
        const onTime = Math.round((onTimeCount / activeBuses.length) * 100);

        const speedEl = document.getElementById('avg-speed');
        const onTimeEl = document.getElementById('on-time-perc');
        if (speedEl) speedEl.innerText = avgSpd;
        if (onTimeEl) onTimeEl.innerText = (onTime > 98 ? 98 : onTime) + '%';
    }

    function renderLiveMap(buses) {
        if (!map) return;
        buses.forEach(bus => {
            if (bus.status !== 'active') {
                if (busMarkers[bus.busId] && map.hasLayer(busMarkers[bus.busId])) map.removeLayer(busMarkers[bus.busId]);
                if (routePolylines[bus.busId] && map.hasLayer(routePolylines[bus.busId])) map.removeLayer(routePolylines[bus.busId]);
                return;
            }

            MockAPI.getRouteById(bus.assignedRoute).then(rRes => {
                const route = rRes.data;
                if (!route || !route.stops.length) return;

                const routeColor = route.color || '#3B82F6';

                // Check if route has changed
                if (currentAssignedRouteId[bus.busId] !== bus.assignedRoute) {
                    if (routePolylines[bus.busId]) {
                        map.removeLayer(routePolylines[bus.busId]);
                    }
                    const latlngs = route.stops.map(s => [s.lat, s.lng]);
                    routePolylines[bus.busId] = L.polyline(latlngs, {
                        color: routeColor,
                        weight: 3,
                        opacity: 0.6,
                        dashArray: '6,6'
                    });
                    // Only add if layer is active
                    if(activeLayers[bus.assignedRoute] !== false) {
                        routePolylines[bus.busId].addTo(map);
                    }
                    currentAssignedRouteId[bus.busId] = bus.assignedRoute;
                }

                // Place/update bus marker at real last-known location
                const loc = (bus.lastLocation && bus.lastLocation.lat) ? bus.lastLocation : route.stops[0];
                const marker = busMarkers[bus.busId];
                
                if (!marker) {
                    busMarkers[bus.busId] = L.marker([loc.lat, loc.lng], {
                        icon: busIcon(map.getZoom(), routeColor)
                    });
                    
                    if(activeLayers[bus.assignedRoute] !== false) {
                        busMarkers[bus.busId].addTo(map);
                    }
                    
                    busMarkers[bus.busId].bindPopup(`<b>${bus.busId}</b><br>Driver: ${bus.assignedDriver}<br>Route: ${route.routeName}<br>Occupancy: ${bus.currentOccupancy}/${bus.capacity}`);
                      
                    // Add CSS transition for smooth interpolation
                    setTimeout(() => {
                        const el = busMarkers[bus.busId].getElement();
                        if (el) el.style.transition = 'transform 2s linear';
                    }, 100);
                } else {
                    const prevLoc = prevLocs[bus.busId];
                    if (prevLoc && (loc.lat !== prevLoc.lat || loc.lng !== prevLoc.lng)) {
                        const distMoved = getDist(loc.lat, loc.lng, prevLoc.lat, prevLoc.lng);
                        if (distMoved > 2) {
                            const dy = loc.lat - prevLoc.lat;
                            const dx = loc.lng - prevLoc.lng;
                            const angle = 90 - (Math.atan2(dy, dx) * 180 / Math.PI);
                            
                            const el = marker.getElement();
                            if (el) {
                                const iconContainer = el.querySelector('div');
                                if (iconContainer) iconContainer.style.transform = `rotate(${angle}deg)`;
                            }
                        }
                    }
                    
                    marker.setLatLng([loc.lat, loc.lng]);
                    marker.setPopupContent(
                        `<b>${bus.busId}</b><br>Driver: ${bus.assignedDriver}<br>Occupancy: ${bus.currentOccupancy}/${bus.capacity}<br>${bus.isLive ? '🟢 Live' : '⚫ Idle'}`
                    );
                }
                prevLocs[bus.busId] = { lat: loc.lat, lng: loc.lng };
            });
        });
    }

    searchInput.addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        MockAPI.getBuses().then(res => {
            const filtered = res.data.filter(b => b.busId.toLowerCase().includes(q) || b.assignedRoute.toLowerCase().includes(q));
            renderFleetList(filtered);
        });
    });

    loadLiveFleet();
    loadDynamicLayers();

    // Poll every 2 seconds for real-time updates
    setInterval(() => {
        MockAPI.getBuses().then(res => {
            const buses = res.data;
            renderFleetList(buses);
            renderLiveMap(buses);
            updateTrafficOverview(buses);
            const statusEl = document.getElementById('active-units-count');
            if (statusEl) statusEl.innerText = buses.filter(b => b.status === 'active').length + ' Active Units';
        });
    }, 2000);

    // Sync admin info
    if (typeof state !== 'undefined' && state.user) {
        const nameEl = document.getElementById('user-name');
        if (nameEl) nameEl.innerText = state.user.name;
        const avatarEl = document.querySelector('.user-card-avatar');
        if (avatarEl) avatarEl.innerText = state.user.name.split(' ').map(n=>n[0]).join('');
    }
</script>
